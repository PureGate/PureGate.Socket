name: Publish Nuget Package

# Manual: Actions > Publish Nuget Package > Run workflow. Publishes the version in VersionPrefix of
# src/PureGate.Socket/PureGate.Socket.csproj, then tags the commit and creates a GitHub release.
# Any failure stops the run: nothing is tagged, released or uploaded unless nuget.org accepted the package.
on:
  workflow_dispatch:
    inputs:
      name:
        description: 'When you press run workflow, the nuget package will be published.'
        default: 'I understand.'

permissions:
  contents: write
  # Trusted publishing: nuget.org trusts this workflow's GitHub OIDC token, so no API key is stored.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Refuses a version that is already tagged or already on nuget.org, before anything is built.
      - name: Version
        id: version
        shell: bash
        run: |
          version=$(dotnet msbuild src/PureGate.Socket/PureGate.Socket.csproj -getProperty:Version)
          echo "Publishing PureGate.Socket $version"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "::error::v$version is already tagged. Raise VersionPrefix in src/PureGate.Socket/PureGate.Socket.csproj."
            exit 1
          fi
          # 200 lists the published versions; 404 means nothing is published yet.
          status=$(curl -sS --retry 3 -o versions.json -w '%{http_code}' https://api.nuget.org/v3-flatcontainer/puregate.socket/index.json)
          if [ "$status" != "200" ] && [ "$status" != "404" ]; then
            echo "::error::Could not read the published versions from nuget.org (HTTP $status)."
            exit 1
          fi
          if [ "$status" = "200" ] && grep -qi "\"${version}\"" versions.json; then
            echo "::error::PureGate.Socket $version is already on nuget.org. Raise VersionPrefix in src/PureGate.Socket/PureGate.Socket.csproj."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Everything public must be declared as shipped before it is released, so the next release can
      # tell new API from released API.
      - name: Public API is shipped
        shell: bash
        run: |
          if grep -qv '^\s*$' src/PureGate.Socket/PublicAPI/PublicAPI.Unshipped.txt; then
            echo "::error::Move the lines of PublicAPI.Unshipped.txt into PublicAPI.Shipped.txt before publishing."
            exit 1
          fi

      - name: Build
        run: dotnet build PureGate.Socket.slnx -c Release

      - name: Test
        run: dotnet test src/PureGate.Socket.Test -c Release --no-build --blame-hang-timeout 2m

      - name: Pack
        run: dotnet pack src/PureGate.Socket -c Release --no-build -o artifacts/packages

      # Exchanges the OIDC token for a temporary API key (valid for an hour), per the trusted publishing
      # policy on nuget.org. user is the nuget.org profile name of the policy's creator.
      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: koculu

      # No --skip-duplicate: a package nuget.org refuses (a conflict included) fails the run. The symbols
      # package (.snupkg) next to it is pushed along with it.
      - name: Publish the package to nuget.org
        run: dotnet nuget push "artifacts/packages/*.nupkg" -k "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" -s https://api.nuget.org/v3/index.json

      - name: Tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "v${{ steps.version.outputs.version }}" artifacts/packages/*
          --target "$GITHUB_SHA"
          --title "PureGate.Socket ${{ steps.version.outputs.version }}"
          --generate-notes

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/packages/
