name: soak

# Run manually from the Actions tab (Soak > Run workflow).
on:
  workflow_dispatch:
    inputs:
      soak-seconds:
        description: Soak duration in seconds (at most 4200; the job stops after 90 minutes)
        default: "3600"
      os:
        description: Runner operating system
        type: choice
        options: [ubuntu, windows, both]
        default: ubuntu
      framework:
        description: Framework to soak on
        type: choice
        options: [net11.0 net10.0, net9.0, net8.0, net7.0, net6.0]
        default: net11.0

jobs:
  soak:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os == 'both' && '["ubuntu-26.04", "windows-latest"]' || inputs.os == 'windows' && '["windows-latest"]' || '["ubuntu-26.04"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            6.0.x
            7.0.x
            8.0.x
            9.0.x
            10.0.x
            11.0.x

      - name: Build
        run: dotnet build PureGate.Socket.slnx -c Release

      # Mixed chaotic traffic for the requested time, then checks that connection state and pooled buffers drain.
      - name: Soak
        env:
          PUREGATE_SOAK_SECONDS: ${{ inputs.soak-seconds }}
        run: >
          dotnet test src/PureGate.Socket.Test -c Release --no-build
          --framework ${{ inputs.framework }}
          --filter Category=Soak
          --blame-hang-timeout 75m
          --logger "console;verbosity=detailed"
